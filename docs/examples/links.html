<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Links template</title>
    <style>
      body {
        margin: 0;
        color: #4a4a4a;
        font-family: 'arial', sans-serif;
        font-size: 12px;
      }

      document-page,
      page-background,
      page-header,
      page-body,
      page-footer {
        display: block;
      }

      page-background {
        background: #f7f8fb;
      }

      page-header,
      page-footer {
        height: 50px;
        padding: 16px 40px;
        background: #eef2ff;
      }

      page-body {
        padding: 24px 40px;
      }

      a {
        color: #3b6bff;
      }

      .spacer {
        height: 900px;
      }
    </style>
  </head>
  <body>
    <document-page format="a4">
      <page-background></page-background>

      <page-header>
        Acme Inc. — <a href="https://productive.io">productive.io</a>
      </page-header>

      <page-body>
        <p>Payment is due within 14 days, see <a href="https://productive.io/terms">our terms</a>.</p>
        <div class="spacer"></div>
        <p>Questions? Write to <a href="mailto:hello@productive.io">hello@productive.io</a>.</p>
      </page-body>

      <page-footer>
        Page <current-page-number>0</current-page-number> — <a href="https://productive.io/contact">contact us</a>
      </page-footer>
    </document-page>
  </body>
</html>
